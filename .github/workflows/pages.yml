name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: node --test tests/selected-works-mascot-sw.test.mjs tests/pages-build.test.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
