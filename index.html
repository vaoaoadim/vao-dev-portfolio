<!doctype html>
<html lang="en" data-language-ready="false">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Developer portfolio by Vadim Bednov: websites, web applications, bots, integrations, and automation."
    />
    <meta name="theme-color" content="#fcfcfc" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111315'/%3E%3Cpath d='M14 15h10l8 25 8-25h10L38 50H26z' fill='%23fcfcfc'/%3E%3C/svg%3E"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("vao.theme");
        document.documentElement.dataset.theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }

      try {
        const savedLanguage = localStorage.getItem("portfolio-language");
        const browserLanguages = navigator.languages?.length
          ? navigator.languages
          : [navigator.language];
        const browserLanguage = browserLanguages.some((language) =>
          language?.toLowerCase().startsWith("ru"),
        )
          ? "ru"
          : "en";
        const language =
          savedLanguage === "ru" || savedLanguage === "en"
            ? savedLanguage
            : browserLanguage;

        document.documentElement.lang = language;
        document.documentElement.dataset.language = language;
        document.documentElement.dataset.languageReady = String(Boolean(savedLanguage));
      } catch {
        document.documentElement.dataset.language = "en";
      }
    </script>
    <style>
      html[data-language-ready="false"] #root {
        visibility: hidden;
      }
    </style>
    <title>v.build | Developer portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <style>
        html,
        body {
          min-width: 320px;
          min-height: 100%;
          margin: 0;
          overflow: hidden;
          background: #fcfcfc;
        }

        .noscript-scene,
        .noscript-scene img {
          position: fixed;
          inset: 0;
          display: block;
          width: 100%;
          height: 100%;
        }

        .noscript-scene img {
          object-fit: contain;
        }
      </style>
      <picture class="noscript-scene">
        <source
          media="(orientation: portrait)"
          srcset="/assets/office-light-portrait.png"
        />
        <img
          src="/assets/office-light-landscape.png"
          width="1672"
          height="941"
          alt=""
        />
      </picture>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
