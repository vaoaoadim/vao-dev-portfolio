    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111315'/%3E%3Cpath d='M14 15h10l8 25 8-25h10L38 50H26z' fill='%23fcfcfc'/%3E%3C/svg%3E"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("vao.theme");
        document.documentElement.dataset.theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }

      try {
        const savedLanguage = localStorage.getItem("portfolio-language");
        const browserLanguages = navigator.languages?.length
          ? navigator.languages
          : [navigator.language];
        const browserLanguage = browserLanguages.some((language) =>
          language?.toLowerCase().startsWith("ru"),
        )
          ? "ru"
          : "en";
        const language =
          savedLanguage === "ru" || savedLanguage === "en"
            ? savedLanguage
            : document.documentElement.dataset.countryLanguage === "ru" ||
                document.documentElement.dataset.countryLanguage === "en"
              ? document.documentElement.dataset.countryLanguage
              : browserLanguage;

        document.documentElement.lang = language;
        document.documentElement.dataset.language = language;
        // Render the browser-language version immediately. The worker can still
        // refine it from the visitor's country without delaying the first paint.
        document.documentElement.dataset.languageReady = "true";
      } catch {
        document.documentElement.dataset.language = "en";
      }
    </script>
    <title>v.build | Developer portfolio</title>
  </head>
